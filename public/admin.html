<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | CyberGuard AI</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">🛡️ CyberGuard <span>AI</span></a><nav><a href="/">Website</a><button id="logoutBtn">Log out</button></nav></header><main class="admin-main"><div class="admin-head"><div><h1>Complaint dashboard</h1><p class="muted">Manage submitted complaints.</p></div><button id="refreshBtn" class="btn">Refresh</button></div><p id="notice" class="error"></p><section class="stats"><div class="stat">Total<b id="total">0</b></div><div class="stat">High priority<b id="high">0</b></div><div class="stat">Under review<b id="review">0</b></div><div class="stat">Resolved<b id="resolved">0</b></div></section><section class="charts"><div class="chart"><h3>By category</h3><div id="categoryChart"></div></div><div class="chart"><h3>By status</h3><div id="statusChart"></div></div></section><section class="table-card"><div class="filters"><input id="search" placeholder="Search ID or description"><select id="categoryFilter"><option value="">All categories</option><option>UPI / Financial Fraud</option><option>Phishing</option><option>Account Hacking</option><option>Social Media Fraud</option><option>Other</option></select><select id="priorityFilter"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select><select id="statusFilter"><option value="">All statuses</option><option>Registered</option><option>Under Review</option><option>Resolved</option></select></div><div class="table-wrap"><table><thead><tr><th>ID / Date</th><th>Description</th><th>Category</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody id="complaintTable"></tbody></table></div><p id="emptyTable" class="muted"></p></section></main><script src="/admin.js" defer></script></body></html>
